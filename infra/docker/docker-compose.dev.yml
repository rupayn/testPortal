services:
  api:
    build:
      context: ../..            # repo root — file lives at infra/docker/, so up two levels
      dockerfile: apps/api/Dockerfile.dev
      target: dev
    container_name: testportal-api-dev
    env_file:
      - ../../apps/api/.env
    ports:
      - "3000:3000"             # host:container — change host port if 3000 is taken
    volumes:
      # Mount source for hot reload — everyone edits on host, code runs in container
      - ../../apps/api/src:/app/apps/api/src
      - ../../apps/api/package.json:/app/apps/api/package.json
      - ../../apps/api/tsconfig.json:/app/apps/api/tsconfig.json
      - ../../apps/api/tsup.config.ts:/app/apps/api/tsup.config.ts
      # Whole packages/ dir — needed so editing packages/db (or any
      # future shared workspace package) hot-reloads api's dev
      # server too, since turbo runs db's dev/watch task alongside
      # api's per turbo.json's dependency graph
      - ../../packages:/app/packages
      - ../../turbo.json:/app/turbo.json
      # Anonymous volumes: keep each package's own container-built
      # node_modules, prevent host bind-mounts above from shadowing
      # them (critical — without this, missing/mismatched local
      # node_modules on host breaks the container, or
      # platform-mismatched native binaries from host leak in)
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
    command: pnpm turbo run dev --filter=api
    restart: unless-stopped
    networks:
      - testportal-network
    # depends_on:
    #   db:
    #     condition: service_healthy

  # -------------------------------------------------------
  # Uncomment once packages/db is added and needs a real
  # database to connect to. Keeps DB containerized too —
  # no one needs Postgres installed on their machine.
  # -------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: testportal-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testportal_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - testportal-network

  adminer:
    image: adminer:latest
    container_name: testportal-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db     # pre-fills the server field with the db service name
    depends_on:
      db:
        condition: service_healthy
    networks:
      - testportal-network

networks:
  testportal-network:
    driver: bridge

volumes:
  db-data: